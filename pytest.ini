[pytest]
testpaths = tests
pythonpath = .
# `slow` tests download real model weights, so they are excluded by default.
# Run them deliberately with: pytest -m slow
addopts = -q --strict-markers -m "not slow"
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning:chromadb.*
    ignore::DeprecationWarning:pydantic.*
markers =
    slow: tests that load real embedding or reranking models
